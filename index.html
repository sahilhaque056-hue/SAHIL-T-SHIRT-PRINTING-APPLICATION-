<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SAHIL T SHIRT PRINTING</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f5f7f9;
color:#222;
padding-bottom:85px;
}

/* ================= HEADER ================= */

.header{
background:#fff;
padding:14px 15px 10px;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top-line{
display:flex;
align-items:center;
justify-content:space-between;
}

.logo-area{
display:flex;
align-items:center;
gap:10px;
}

.logo{
width:43px;
height:43px;
border-radius:12px;
background:#ff5a00;
display:flex;
align-items:center;
justify-content:center;
font-size:23px;
}

.shop-name{
font-size:16px;
font-weight:900;
}

.shop-sub{
font-size:10px;
color:#777;
margin-top:2px;
}

.header-icons{
display:flex;
gap:8px;
}

.icon-btn{
width:40px;
height:40px;
border:0;
border-radius:12px;
background:#f3f4f6;
font-size:20px;
cursor:pointer;
position:relative;
}

.cart-badge{
position:absolute;
right:-4px;
top:-5px;
background:#ff3b30;
color:#fff;
font-size:10px;
font-weight:bold;
min-width:18px;
height:18px;
border-radius:20px;
display:none;
align-items:center;
justify-content:center;
}

/* ================= ADDRESS ================= */

.address{
margin-top:11px;
height:42px;
background:#eef6ff;
border-radius:12px;
display:flex;
align-items:center;
padding:0 12px;
gap:8px;
font-size:13px;
}

.address-icon{
font-size:18px;
}

.address strong{
font-size:13px;
}

.address a{
color:#333;
font-weight:700;
text-decoration:underline;
margin-left:4px;
}

/* ================= SEARCH ================= */

.search-box{
margin-top:11px;
height:54px;
background:#fff;
border:2px solid #ff7a35;
border-radius:15px;
display:flex;
align-items:center;
padding:0 13px;
gap:10px;
}

.search-icon{
font-size:25px;
}

.search-box input{
flex:1;
height:100%;
border:0;
outline:none;
font-size:15px;
background:transparent;
}

.clear-search{
display:none;
border:0;
background:none;
font-size:20px;
cursor:pointer;
}

/* ================= CATEGORIES ================= */

.categories{
background:#fff;
margin-top:10px;
padding:12px 0 8px;
display:flex;
gap:16px;
overflow-x:auto;
scrollbar-width:none;
}

.categories::-webkit-scrollbar{
display:none;
}

.category{
min-width:68px;
text-align:center;
cursor:pointer;
}

.category-image{
width:58px;
height:58px;
margin:auto;
border-radius:15px;
background:#f5f5f5;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
border:1px solid #eee;
}

.category-image img{
width:100%;
height:100%;
object-fit:cover;
}

.category-icon{
font-size:28px;
}

.category-name{
font-size:11px;
margin-top:6px;
font-weight:600;
white-space:nowrap;
}

/* ================= BANNER ================= */

.banner{
margin:14px 15px 0;
height:190px;
border-radius:20px;
overflow:hidden;
position:relative;
background:linear-gradient(135deg,#111,#ff5a00);
}

.banner-content{
position:absolute;
left:20px;
top:22px;
z-index:2;
color:#fff;
width:57%;
}

.banner-small{
font-size:11px;
font-weight:700;
letter-spacing:.5px;
opacity:.9;
}

.banner-title{
font-size:27px;
font-weight:900;
line-height:1.05;
margin-top:7px;
}

.banner-text{
font-size:12px;
margin-top:8px;
line-height:1.4;
}

.banner-btn{
margin-top:13px;
padding:9px 15px;
border:0;
border-radius:9px;
background:#fff;
color:#111;
font-size:12px;
font-weight:800;
cursor:pointer;
}

.banner-image{
position:absolute;
right:-8px;
bottom:-12px;
width:49%;
height:95%;
object-fit:contain;
z-index:1;
}

/* dots */

.dots{
display:flex;
justify-content:center;
gap:5px;
margin-top:9px;
}

.dot{
width:7px;
height:7px;
border-radius:50%;
background:#ccc;
}

.dot.active{
width:20px;
border-radius:10px;
background:#ff5a00;
}

/* ================= SECTION ================= */

.section{
margin:18px 15px 0;
}

.section-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px;
}

.section-title{
font-size:21px;
font-weight:900;
}

.see-all{
font-size:12px;
font-weight:700;
color:#ff5a00;
cursor:pointer;
}

/* ================= DEMAND ================= */

.demand{
background:#dff7ee;
border-radius:20px;
padding:15px;
}

.demand-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.demand-card{
background:#fff;
border-radius:15px;
padding:9px;
cursor:pointer;
overflow:hidden
