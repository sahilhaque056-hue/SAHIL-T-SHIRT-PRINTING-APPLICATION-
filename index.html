<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAHIL T SHIRT PRINTING</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    .search {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
    }

    .container {
      padding: 18px;
      max-width: 700px;
      margin: auto;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin: 15px 0 25px;
    }

    .category {
      background: white;
      border: 1px solid #ddd;
      padding: 12px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .products {
      display: grid;
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .product-image {
      height: 180px;
      background: #eee;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin-bottom: 7px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .cart {
      margin-top: 25px;
      background: white;
      padding: 18px;
      border-radius: 12px;
      text-align: center;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>SAHIL T SHIRT PRINTING</h1>
    <input
      class="search"
      type="text"
      placeholder="🔍 Search products..."
    >
  </header>

  <main class="container">

    <h2 class="section-title">Categories</h2>

    <div class="categories">
      <div class="category">👕 T-Shirts</div>
      <div class="category">☕ Mugs</div>
      <div class="category">🧢 Caps</div>
      <div class="category">🎁 Gifts</div>
    </div>

    <h2 class="section-title">🔥 Popular Products</h2>

    <div class="products">

      <div class="product">
        <div class="product-image">👕</div>
        <h3>Custom T-Shirt</h3>
        <p class="price">Starting ₹299</p>
        <button class="btn" onclick="customize('Custom T-Shirt')">
          Customize
        </button>
      </div>

      <div class="product">
        <div class="product-image">☕</div>
        <h3>Custom Mug</h3>
        <p class="price">Starting ₹199</p>
        <button class="btn" onclick="customize('Custom Mug')">
          Customize
        </button>
      </div>

      <div class="product">
        <div class="product-image">🧢</div>
        <h3>Custom Cap</h3>
        <p class="price">Starting ₹249</p>
        <button class="btn" onclick="customize('Custom Cap')">
          Customize
        </button>
      </div>

    </div>

    <div class="cart">
      🛒 <strong>Your Cart</strong>
      <p style="margin-top:8px;">Your cart is empty</p>
    </div>

  </main>

  <footer>
    © 2026 SAHIL T SHIRT PRINTING
  </footer>

  <script>
    function customize(product) {
      alert(product + " customization coming soon!");
    }
  </script>

</body>
</html>
