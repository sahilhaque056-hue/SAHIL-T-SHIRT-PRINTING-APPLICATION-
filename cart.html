<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cart | SAHIL T SHIRT PRINTING</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f5ff;
  color:#24152f;
  padding-bottom:30px;
}

.header{
  background:#fff;
  padding:15px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 15px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:13px;
  background:#eee5ff;
  color:#6422c5;
  font-size:23px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:14px;
  background:#ffd400;
  color:#3d1767;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:1000;
}

.title{
  font-size:17px;
  font-weight:1000;
}

.sub{
  font-size:11px;
  color:#888;
  margin-top:3px;
}

.container{
  max-width:600px;
  margin:auto;
  padding:18px 15px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:15px;
  box-shadow:0 5px 20px rgba(45,20,70,.08);
  margin-bottom:15px;
}

.product{
  display:flex;
  gap:14px;
  align-items:center;
}

.product-image{
  width:95px;
  height:95px;
  border-radius:16px;
  background:#f8f7fa;
  object-fit:contain;
  padding:8px;
}

.product-info{
  flex:1;
}

.product-name{
  font-size:17px;
  font-weight:1000;
}

.detail{
  color:#81758b;
  font-size:12px;
  margin-top:6px;
  line-height:1.5;
}

.price{
  margin-top:8px;
  color:#6825c8;
  font-size:19px;
  font-weight:1000;
}

.quantity{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:12px;
}

.qty-btn{
  width:34px;
  height:34px;
  border:0;
  border-radius:10px;
  background:#eee5ff;
  color:#6422c5;
  font-size:20px;
  font-weight:bold;
}

.qty-number{
  min-width:25px;
  text-align:center;
  font-weight:900;
}

.design{
  margin-top:15px;
  text-align:center;
}

.design img{
  max-width:100%;
  max-height:220px;
  border-radius:14px;
  object-fit:contain;
  border:1px solid #eee;
}

.design-title{
  font-size:11px;
  color:#888;
  margin-top:6px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
  font-size:14px;
}

.total{
  border-top:1px solid #eee;
  padding-top:13px;
  margin-top:13px;
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:1000;
}

.total-price{
  color:#6825c8;
}

.order-btn{
  width:100%;
  border:0;
  border-radius:15px;
  padding:15px;
  background:linear-gradient(135deg,#6c2bd9,#8c45ed);
  color:#fff;
  font-size:15px;
  font-weight:1000;
  box-shadow:0 7px 18px rgba(108,43,217,.25);
}

.clear-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:0;
  border-radius:13px;
  background:#fff0f0;
  color:#e53935;
  font-weight:900;
}

.empty{
  text-align:center;
  padding:55px 20px;
}

.empty-icon{
  font-size:55px;
}

.empty h2{
  margin-top:12px;
  font-size:22px;
}

.empty p{
  color:#888;
  margin-top:7px;
  font-size:13px;
}

.shop-btn{
  margin-top:18px;
  border:0;
  padding:13px 20px;
  border-radius:13px;
  background:#ffd400;
  color:#3d1767;
  font-weight:1000;
}
</style>
</head>

<body>

<div class="header">

  <button class="back" onclick="goBack()">
    ←
  </button>

  <div class="logo">
    ST
  </div>

  <div>
    <div class="title">
      Your Cart
    </div>

    <div class="sub">
      SAHIL T SHIRT PRINTING
    </div>
  </div>

</div>


<div class="container" id="cartContainer">
</div>


<script>

let cart = null;


/* LOAD CART */

function loadCart(){

  const saved =
    localStorage.getItem("cartItem");

  const container =
    document.getElementById("cartContainer");


  if(!saved){

    showEmpty();
    return;

  }


  try{

    cart = JSON.parse(saved);

  }catch(error){

    localStorage.removeItem("cartItem");
    showEmpty();
    return;

  }


  if(!cart){

    showEmpty();
    return;

  }


  renderCart();

}


/* SHOW CART */

function renderCart(){

  const container =
    document.getElementById("cartContainer");


  const quantity =
    Number(cart.quantity) || 1;


  const unitPrice =
    Number(cart.unitPrice) ||
    Number(cart.price) ||
    0;


  const total =
    unitPrice * quantity;


  cart.quantity = quantity;
  cart.unitPrice = unitPrice;
  cart.price = total;


  let image =
    cart.image || "";


  if(!image){

    if(
      cart.product &&
      cart.product.toLowerCase().includes("mug")
    ){
      image = "mug.jpg.jpg";
    }

    else if(
      cart.product &&
      cart.product.toLowerCase().includes("gift")
    ){
      image = "gift.jpg.jpg";
    }

    else if(
      cart.product &&
      cart.product.toLowerCase().includes("cap")
    ){
      image = "cap.jpg.jpg";
    }

    else{
      image = "tshirt.jpg.png";
    }

  }


  let details = "";


  if(cart.color){
    details += "Colour: " +
      cart.color + "<br>";
  }


  if(cart.size){
    details += "Size: " +
      cart.size + "<br>";
  }


  if(cart.customText){
    details += "Text: " +
      cart.customText + "<br>";
  }


  if(cart.orderNote){
    details += "Note: " +
      cart.orderNote;
  }


  container.innerHTML = `

    <div class="card">

      <div class="product">

        <img
          class="product-image"
          src="${image}"
          alt="Product"
          onerror="this.style.display='none'"
        >

        <div class="product-info">

          <div class="product-name">
            ${cart.product || "Custom Product"}
          </div>

          <div class="detail">
            ${details || "Customised product"}
          </div>

          <div class="price">
            ₹${unitPrice}
          </div>

          <div class="quantity">

            <button
              class="qty-btn"
              onclick="decreaseQty()"
            >
              −
            </button>

            <div class="qty-number">
              ${quantity}
            </div>

            <button
              class="qty-btn"
              onclick="increaseQty()"
            >
              +
            </button>

          </div>

        </div>

      </div>


      ${
        cart.design
        ?
        `
        <div class="design">

          <img
            src="${cart.design}"
            alt="Uploaded Design"
          >

          <div class="design-title">
            Uploaded Design
          </div>

        </div>
        `
        :
        ""
      }

    </div>


    <div class="card">

      <div class="summary-row">
        <span>Price</span>
        <span>₹${unitPrice}</span>
      </div>

      <div class="summary-row">
        <span>Quantity</span>
        <span>${quantity}</span>
      </div>

      <div class="summary-row">
        <span>Delivery</span>
        <span>To be confirmed</span>
      </div>

      <div class="total">
        <span>Total</span>
        <span class="total-price">
          ₹${total}
        </span>
      </div>

    </div>


    <div class="card">

      <button
        class="order-btn"
        onclick="goToOrder()"
      >
        Continue to Order →
      </button>

      <button
        class="clear-btn"
        onclick="clearCart()"
      >
        Remove from Cart
      </button>

    </div>

  `;


  localStorage.setItem(
    "cartItem",
    JSON.stringify(cart)
  );

}


/* INCREASE */

function increaseQty(){

  if(!cart) return;

  cart.quantity =
    (Number(cart.quantity) || 1) + 1;

  cart.price =
    cart.unitPrice * cart.quantity;

  saveAndRender();

}


/* DECREASE */

function decreaseQty(){

  if(!cart) return;

  let quantity =
    Number(cart.quantity) || 1;


  if(quantity <= 1){

    return;

  }


  quantity--;

  cart.quantity =
    quantity;

  cart.price =
    cart.unitPrice * quantity;

  saveAndRender();

}


/* SAVE */

function saveAndRender(){

  localStorage.setItem(
    "cartItem",
    JSON.stringify(cart)
  );

  renderCart();

}


/* ORDER */

function goToOrder(){

  if(!cart){

    alert(
      "Cart empty hai."
    );

    return;

  }


  window.location.href =
    "order.html";

}


/* CLEAR */

function clearCart(){

  const ok =
    confirm(
      "Cart se product remove karein?"
    );


  if(!ok){
    return;
  }


  localStorage.removeItem(
    "cartItem"
  );


  showEmpty();

}


/* EMPTY */

function showEmpty(){

  const container =
    document.getElementById(
      "cartContainer"
    );


  container.innerHTML = `

    <div class="card empty">

      <div class="empty-icon">
        🛒
      </div>

      <h2>
        Your Cart is Empty
      </h2>

      <p>
        Apna favourite custom product choose karein.
      </p>

      <button
        class="shop-btn"
        onclick="goHome()"
      >
        Start Shopping →
      </button>

    </div>

  `;

}


/* BACK */

function goBack(){

  if(document.referrer){

    history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


/* HOME */

function goHome(){

  window.location.href =
    "index.html";

}


/* START */

loadCart();

</script>

</body>
</html>
