<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Cart - SAHIL T SHIRT PRINTING</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f7f5ff;
  color:#222;
  padding-bottom:30px;
}

.header{
  background:linear-gradient(135deg,#5b21b6,#7c3aed);
  color:white;
  padding:17px 16px;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.header-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border:none;
  border-radius:13px;
  background:rgba(255,255,255,.18);
  color:white;
  font-size:23px;
  cursor:pointer;
}

.header h1{
  font-size:21px;
  font-weight:800;
}

.header p{
  font-size:12px;
  opacity:.85;
  margin-top:3px;
}

.container{
  max-width:650px;
  margin:auto;
  padding:16px;
}

/* CART ITEM */

.cart-card{
  background:white;
  border-radius:22px;
  padding:14px;
  box-shadow:0 5px 22px rgba(76,29,149,.10);
  margin-bottom:18px;
}

.product-top{
  display:flex;
  gap:14px;
}

.product-image{
  width:105px;
  height:105px;
  object-fit:cover;
  border-radius:16px;
  background:#eee;
}

.product-info{
  flex:1;
  min-width:0;
}

.product-name{
  font-size:18px;
  font-weight:800;
  color:#3b176d;
  margin-bottom:7px;
}

.details{
  font-size:13px;
  color:#666;
  line-height:1.7;
}

.price{
  font-size:21px;
  font-weight:900;
  color:#6d28d9;
  margin-top:7px;
}

.remove-btn{
  border:none;
  background:#fff0f0;
  color:#dc2626;
  padding:9px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  margin-top:12px;
  cursor:pointer;
}

/* DESIGN PREVIEW */

.design-preview{
  display:none;
  width:100%;
  max-height:180px;
  object-fit:contain;
  background:#f4f0ff;
  border-radius:15px;
  padding:8px;
  margin-top:14px;
}

/* QUANTITY */

.quantity-area{
  border-top:1px solid #eee;
  margin-top:14px;
  padding-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.quantity-label{
  font-size:14px;
  font-weight:700;
}

.quantity-control{
  display:flex;
  align-items:center;
  gap:12px;
}

.qty-btn{
  width:35px;
  height:35px;
  border:none;
  border-radius:10px;
  background:#eee8ff;
  color:#5b21b6;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
}

.qty-number{
  min-width:25px;
  text-align:center;
  font-weight:800;
}

/* EMPTY */

.empty{
  background:white;
  border-radius:24px;
  padding:45px 20px;
  text-align:center;
  box-shadow:0 5px 22px rgba(76,29,149,.10);
}

.empty-icon{
  font-size:65px;
  margin-bottom:15px;
}

.empty h2{
  color:#4c1d95;
  margin-bottom:8px;
}

.empty p{
  color:#777;
  font-size:14px;
  margin-bottom:20px;
}

.shop-btn{
  border:none;
  background:linear-gradient(135deg,#facc15,#f59e0b);
  color:#351000;
  padding:14px 25px;
  border-radius:14px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
}

/* SUMMARY */

.summary{
  background:white;
  border-radius:22px;
  padding:18px;
  box-shadow:0 5px 22px rgba(76,29,149,.10);
  margin-top:18px;
}

.summary-title{
  color:#4c1d95;
  font-size:18px;
  font-weight:900;
  margin-bottom:15px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
  font-size:14px;
}

.summary-row.total{
  border-top:1px solid #eee;
  padding-top:15px;
  margin-top:8px;
  font-size:20px;
  font-weight:900;
  color:#5b21b6;
}

.order-btn{
  width:100%;
  border:none;
  margin-top:18px;
  padding:16px;
  border-radius:16px;
  background:linear-gradient(135deg,#facc15,#f59e0b);
  color:#351000;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 6px 18px rgba(245,158,11,.25);
}

.continue-btn{
  width:100%;
  border:2px solid #7c3aed;
  margin-top:10px;
  padding:14px;
  border-radius:15px;
  background:white;
  color:#6d28d9;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.secure{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:15px;
}

/* CUSTOM DETAILS */

.custom-box{
  margin-top:13px;
  background:#faf8ff;
  border-radius:14px;
  padding:12px;
  font-size:13px;
  line-height:1.7;
}

.custom-title{
  font-weight:800;
  color:#5b21b6;
  margin-bottom:4px;
}

@media(max-width:380px){

  .product-image{
    width:90px;
    height:90px;
  }

  .product-name{
    font-size:16px;
  }

}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

  <div class="header-row">

    <button class="back" onclick="goHome()">
      ‹
    </button>

    <div>
      <h1>🛒 My Cart</h1>
      <p>Apna customized product check karein</p>
    </div>

  </div>

</div>


<div class="container">

  <!-- CART CONTENT -->

  <div id="cartContainer"></div>

</div>


<script>

let cartItem = null;


/* LOAD CART */

function loadCart(){

  const savedCart =
    localStorage.getItem("cartItem");

  const container =
    document.getElementById("cartContainer");

  if(!savedCart){

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>Cart Empty Hai</h2>

        <p>
          Abhi aapne koi product select nahi kiya.
        </p>

        <button class="shop-btn" onclick="goHome()">
          🛍️ Start Shopping
        </button>

      </div>

    `;

    return;
  }


  try{

    cartItem = JSON.parse(savedCart);

    renderCart();

  }catch(error){

    localStorage.removeItem("cartItem");

    container.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          ⚠️
        </div>

        <h2>Cart Error</h2>

        <p>
          Cart data reset kar diya gaya hai.
        </p>

        <button class="shop-btn" onclick="goHome()">
          🏠 Home
        </button>

      </div>

    `;
  }
}


/* RENDER CART */

function renderCart(){

  const container =
    document.getElementById("cartContainer");

  if(!cartItem){

    container.innerHTML = "";

    return;
  }


  let quantity =
    parseInt(cartItem.quantity) || 1;

  let unitPrice =
    parseInt(cartItem.unitPrice) || 0;

  let total =
    unitPrice * quantity;


  cartItem.quantity = quantity;

  cartItem.price = total;


  /* DETAILS */

  let details = "";


  if(cartItem.color){
    details += "🎨 Color: " +
      escapeHTML(cartItem.color) +
      "<br>";
  }


  if(cartItem.size){
    details += "📏 Size: " +
      escapeHTML(cartItem.size) +
      "<br>";
  }


  if(cartItem.capStyle){
    details += "🧢 Style: " +
      escapeHTML(cartItem.capStyle) +
      "<br>";
  }


  if(cartItem.mugType){
    details += "☕ Type: " +
      escapeHTML(cartItem.mugType) +
      "<br>";
  }


  if(cartItem.giftType){
    details += "🎁 Gift: " +
      escapeHTML(cartItem.giftType) +
      "<br>";
  }


  if(cartItem.giftWrap){
    details += "🎀 Gift Wrap: Yes<br>";
  }


  if(cartItem.giftMessage){
    details += "💌 Gift Message: " +
      escapeHTML(cartItem.giftMessage) +
      "<br>";
  }


  if(!details){
    details = "✨ Customized Product";
  }


  /* CUSTOM DETAILS */

  let customDetails = "";


  if(cartItem.customText){

    customDetails += `

      <div class="custom-box">

        <div class="custom-title">
          ✍️ Custom Text
        </div>

        ${escapeHTML(cartItem.customText)}

      </div>

    `;
  }


  if(cartItem.message){

    customDetails += `

      <div class="custom-box">

        <div class="custom-title">
          💌 Message
        </div>

        ${escapeHTML(cartItem.message)}

      </div>

    `;
  }


  if(cartItem.orderNote){

    customDetails += `

      <div class="custom-box">

        <div class="custom-title">
          📝 Special Instructions
        </div>

        ${escapeHTML(cartItem.orderNote)}

      </div>

    `;
  }


  let designHTML = "";


  if(cartItem.design){

    designHTML = `

      <img
        src="${cartItem.design}"
        class="design-preview"
        style="display:block;"
        alt="Uploaded Design"
      >

    `;
  }


  container.innerHTML = `

    <div class="cart-card">

      <div class="product-top">

        <img
          src="${cartItem.image || 'tshirt.jpg.png'}"
          class="product-image"
          alt="Product"
          onerror="this.src='tshirt.jpg.png'"
        >

        <div class="product-info">

          <div class="product-name">
            ${escapeHTML(cartItem.product || "Custom Product")}
          </div>

          <div class="details">
            ${details}
          </div>

          <div class="price">
            ₹${total}
          </div>

        </div>

      </div>


      ${designHTML}


      ${customDetails}


      <div class="quantity-area">

        <div class="quantity-label">
          Quantity
        </div>

        <div class="quantity-control">

          <button
            class="qty-btn"
            onclick="changeQuantity(-1)"
          >
            −
          </button>

          <div
            class="qty-number"
            id="qtyNumber"
          >
            ${quantity}
          </div>

          <button
            class="qty-btn"
            onclick="changeQuantity(1)"
          >
            +
          </button>

        </div>

      </div>


      <button
        class="remove-btn"
        onclick="removeCart()"
      >
        🗑️ Remove from Cart
      </button>

    </div>


    <div class="summary">

      <div class="summary-title">
        💰 Order Summary
      </div>


      <div class="summary-row">

        <span>
          Product
        </span>

        <span>
          ₹${unitPrice}
        </span>

      </div>


      <div class="summary-row">

        <span>
          Quantity
        </span>

        <span>
          ${quantity}
        </span>

      </div>


      <div class="summary-row total">

        <span>
          Total
        </span>

        <span>
          ₹${total}
        </span>

      </div>


      <button
        class="order-btn"
        onclick="placeOrder()"
      >
        📦 Place Order
      </button>


      <button
        class="continue-btn"
        onclick="goHome()"
      >
        ← Continue Shopping
      </button>


      <div class="secure">
        🔒 Customized order details saved on your device
      </div>

    </div>

  `;

}


/* CHANGE QUANTITY */

function changeQuantity(change){

  if(!cartItem){
    return;
  }


  let quantity =
    parseInt(cartItem.quantity) || 1;


  quantity += change;


  if(quantity < 1){
    quantity = 1;
  }


  if(quantity > 20){
    quantity = 20;
  }


  cartItem.quantity = quantity;


  cartItem.price =
    (parseInt(cartItem.unitPrice) || 0)
    * quantity;


  localStorage.setItem(
    "cartItem",
    JSON.stringify(cartItem)
  );


  renderCart();
}


/* REMOVE */

function removeCart(){

  const confirmRemove =
    confirm("🗑️ Kya aap cart se product remove karna chahte hain?");


  if(!confirmRemove){
    return;
  }


  localStorage.removeItem("cartItem");

  cartItem = null;

  loadCart();
}


/* PLACE ORDER */

function placeOrder(){

  if(!cartItem){

    alert("🛒 Cart empty hai.");

    return;
  }


  localStorage.setItem(
    "orderItem",
    JSON.stringify(cartItem)
  );


  window.location.href =
    "order.html";
}


/* HOME */

function goHome(){

  window.location.href =
    "index.html";
}


/* HTML SAFETY */

function escapeHTML(value){

  if(value === null ||
     value === undefined){

    return "";
  }


  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* START */

loadCart();

</script>

</body>
</html>
