<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customize T-Shirt | SAHIL T SHIRT PRINTING</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f7f7fb;
  color:#222;
  padding-bottom:90px;
}

/* HEADER */
.header{
  height:64px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 15px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:12px;
  background:#f1eaff;
  color:#5b21b6;
  font-size:21px;
}

.headerTitle{
  color:#4c1d95;
  font-size:17px;
  font-weight:bold;
}

/* PAGE */
.container{
  padding:15px;
  max-width:600px;
  margin:auto;
}

/* PRODUCT PREVIEW */
.previewBox{
  background:#fff;
  border-radius:22px;
  padding:15px;
  box-shadow:0 5px 18px rgba(0,0,0,.08);
  text-align:center;
}

.productImage{
  width:100%;
  height:260px;
  object-fit:contain;
  border-radius:18px;
  background:#f5f5f5;
}

/* TITLE */
.titleBox{
  margin:18px 2px;
}

.titleBox h1{
  font-size:24px;
  color:#35126b;
}

.titleBox p{
  margin-top:6px;
  color:#777;
  font-size:13px;
}

/* CARD */
.card{
  background:#fff;
  padding:17px;
  border-radius:20px;
  margin-top:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.07);
}

.label{
  display:block;
  font-size:15px;
  font-weight:bold;
  margin-bottom:11px;
  color:#35126b;
}

/* COLORS */
.colors{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.colorBtn{
  width:43px;
  height:43px;
  border-radius:50%;
  border:3px solid #ddd;
  cursor:pointer;
}

.colorBtn.active{
  outline:3px solid #6c2bd9;
  outline-offset:2px;
}

.black{background:#111;}
.white{background:#fff;}
.red{background:#e53935;}
.blue{background:#1976d2;}
.green{background:#2e9d55;}
.yellow{background:#ffd928;}
.pink{background:#ff7eb6;}

/* SIZES */
.sizes{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
}

.sizeBtn{
  padding:12px 5px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.sizeBtn.active{
  background:#6c2bd9;
  color:#fff;
  border-color:#6c2bd9;
}

/* QUANTITY */
.quantity{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
}

.qtyBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#6c2bd9;
  color:#fff;
  font-size:23px;
  cursor:pointer;
}

.qtyNumber{
  font-size:20px;
  font-weight:bold;
  min-width:25px;
  text-align:center;
}

/* INPUT */
.input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  font-size:14px;
}

textarea.input{
  resize:none;
  height:90px;
}

/* UPLOAD */
.uploadBox{
  border:2px dashed #9b70df;
  background:#faf7ff;
  border-radius:15px;
  padding:20px 12px;
  text-align:center;
}

.uploadIcon{
  font-size:35px;
}

.uploadBox p{
  margin:7px 0 12px;
  font-size:13px;
  color:#777;
}

.uploadBtn{
  display:inline-block;
  background:#6c2bd9;
  color:#fff;
  padding:10px 17px;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
  cursor:pointer;
}

#fileInput{
  display:none;
}

.fileName{
  margin-top:10px;
  font-size:12px;
  color:#555;
  word-break:break-word;
}

/* PRICE */
.priceCard{
  background:linear-gradient(135deg,#35126b,#6c2bd9);
  color:#fff;
  padding:18px;
  border-radius:18px;
  margin-top:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.priceCard span:first-child{
  font-size:14px;
}

#totalPrice{
  color:#ffd928;
  font-size:24px;
  font-weight:bold;
}

/* ADD CART */
.bottomBar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:#fff;
  padding:12px 15px;
  box-shadow:0 -3px 15px rgba(0,0,0,.12);
  z-index:200;
}

.addCart{
  width:100%;
  max-width:600px;
  display:block;
  margin:auto;
  border:0;
  background:#ffd928;
  color:#35126b;
  padding:15px;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.addCart:active{
  transform:scale(.98);
}

/* DESIGN PREVIEW */
#designPreview{
  display:none;
  margin-top:12px;
  text-align:center;
}

#designPreview img{
  max-width:100%;
  max-height:180px;
  border-radius:12px;
  object-fit:contain;
  border:1px solid #ddd;
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

  <button class="back" onclick="goBack()">←</button>

  <div class="headerTitle">
    👕 Customize T-Shirt
  </div>

</header>


<main class="container">

  <!-- PRODUCT IMAGE -->
  <div class="previewBox">

    <img
      src="tshirt.jpg.png"
      alt="Custom T-Shirt"
      class="productImage"
    >

  </div>


  <!-- TITLE -->
  <div class="titleBox">

    <h1>Custom Printed T-Shirt</h1>

    <p>
      Apna photo, design ya text print karwao ❤️
    </p>

  </div>


  <!-- COLOR -->
  <div class="card">

    <label class="label">🎨 Select T-Shirt Colour</label>

    <div class="colors">

      <button
        class="colorBtn black active"
        data-color="Black"
        onclick="selectColor(this)"
      ></button>

      <button
        class="colorBtn white"
        data-color="White"
        onclick="selectColor(this)"
      ></button>

      <button
        class="colorBtn red"
        data-color="Red"
        onclick="selectColor(this)"
      ></button>

      <button
        class="colorBtn blue"
        data-color="Blue"
        onclick="selectColor(this)"
      ></button>

      <button
        class="colorBtn green"
        data-color="Green"
        onclick="selectColor(this)"
      ></button>

      <button
        class="colorBtn yellow"
        data-color="Yellow"
        onclick="selectColor(this)"
      ></button>

      <button
        class="colorBtn pink"
        data-color="Pink"
        onclick="selectColor(this)"
      ></button>

    </div>

    <p
      id="selectedColor"
      style="margin-top:10px;font-size:13px;color:#777;"
    >
      Selected: Black
    </p>

  </div>


  <!-- SIZE -->
  <div class="card">

    <label class="label">📏 Select Size</label>

    <div class="sizes">

      <button class="sizeBtn" onclick="selectSize(this)">S</button>

      <button class="sizeBtn active" onclick="selectSize(this)">M</button>

      <button class="sizeBtn" onclick="selectSize(this)">L</button>

      <button class="sizeBtn" onclick="selectSize(this)">XL</button>

      <button class="sizeBtn" onclick="selectSize(this)">XXL</button>

    </div>

  </div>


  <!-- DESIGN UPLOAD -->
  <div class="card">

    <label class="label">🖼️ Upload Your Design</label>

    <div class="uploadBox">

      <div class="uploadIcon">📸</div>

      <p>
        Apna photo ya printing design upload karein
      </p>

      <label class="uploadBtn" for="fileInput">
        Choose Image
      </label>

      <input
        type="file"
        id="fileInput"
        accept="image/*"
        onchange="uploadDesign(event)"
      >

      <div id="fileName" class="fileName">
        No image selected
      </div>

      <div id="designPreview">
        <img id="previewImage" alt="Design Preview">
      </div>

    </div>

  </div>


  <!-- CUSTOM TEXT -->
  <div class="card">

    <label class="label">✍️ Custom Text</label>

    <input
      type="text"
      id="customText"
      class="input"
      placeholder="Example: Happy Birthday Rahul"
      maxlength="80"
    >

  </div>


  <!-- ORDER NOTE -->
  <div class="card">

    <label class="label">📝 Special Instructions</label>

    <textarea
      id="orderNote"
      class="input"
      placeholder="Example: Photo centre mein chahiye..."
      maxlength="200"
    ></textarea>

  </div>


  <!-- QUANTITY -->
  <div class="card">

    <label class="label">🔢 Quantity</label>

    <div class="quantity">

      <button class="qtyBtn" onclick="changeQuantity(-1)">
        −
      </button>

      <div class="qtyNumber" id="quantity">
        1
      </div>

      <button class="qtyBtn" onclick="changeQuantity(1)">
        +
      </button>

    </div>

  </div>


  <!-- PRICE -->
  <div class="priceCard">

    <span>💰 Total Price</span>

    <span id="totalPrice">
      ₹299
    </span>

  </div>

</main>


<!-- ADD TO CART -->
<div class="bottomBar">

  <button class="addCart" onclick="addToCart()">
    🛒 Add to Cart • ₹<span id="bottomPrice">299</span>
  </button>

</div>


<script>

const PRICE = 299;

let selectedColor = "Black";
let selectedSize = "M";
let quantity = 1;
let designData = "";


/* BACK */
function goBack(){
  window.location.href = "index.html";
}


/* COLOR */
function selectColor(button){

  document
    .querySelectorAll(".colorBtn")
    .forEach(function(btn){
      btn.classList.remove("active");
    });

  button.classList.add("active");

  selectedColor =
    button.getAttribute("data-color");

  document.getElementById("selectedColor").textContent =
    "Selected: " + selectedColor;
}


/* SIZE */
function selectSize(button){

  document
    .querySelectorAll(".sizeBtn")
    .forEach(function(btn){
      btn.classList.remove("active");
    });

  button.classList.add("active");

  selectedSize = button.textContent.trim();
}


/* QUANTITY */
function changeQuantity(change){

  quantity = quantity + change;

  if(quantity < 1){
    quantity = 1;
  }

  if(quantity > 20){
    quantity = 20;
  }

  document.getElementById("quantity").textContent =
    quantity;

  updatePrice();
}


/* PRICE */
function updatePrice(){

  const total = PRICE * quantity;

  document.getElementById("totalPrice").textContent =
    "₹" + total;

  document.getElementById("bottomPrice").textContent =
    total;
}


/* UPLOAD DESIGN */
function uploadDesign(event){

  const file = event.target.files[0];

  if(!file){
    return;
  }

  if(!file.type.startsWith("image/")){
    alert("Please image file select karein.");
    return;
  }

  document.getElementById("fileName").textContent =
    file.name;

  const reader = new FileReader();

  reader.onload = function(e){

    designData = e.target.result;

    document.getElementById("previewImage").src =
      designData;

    document.getElementById("designPreview").style.display =
      "block";

  };

  reader.readAsDataURL(file);
}


/* ADD TO CART */
function addToCart(){

  const customText =
    document.getElementById("customText").value.trim();

  const orderNote =
    document.getElementById("orderNote").value.trim();

  const total =
    PRICE * quantity;


  const cartItem = {

    product: "Custom Printed T-Shirt",

    image: "tshirt.jpg.png",

    color: selectedColor,

    size: selectedSize,

    quantity: quantity,

    unitPrice: PRICE,

    price: total,

    customText: customText,

    orderNote: orderNote,

    design: designData

  };


  localStorage.setItem(
    "cartItem",
    JSON.stringify(cartItem)
  );


  alert("✅ T-Shirt Cart mein add ho gaya!");

  window.location.href = "cart.html";

}


/* INITIAL PRICE */
updatePrice();

</script>

</body>
  </html>
