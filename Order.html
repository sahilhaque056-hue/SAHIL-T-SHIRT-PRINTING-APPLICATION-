<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Place Order | SAHIL T SHIRT PRINTING</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#111;
  padding-bottom:30px;
}

header{
  background:#111;
  color:white;
  padding:17px;
}

.header{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  font-size:25px;
  cursor:pointer;
}

.logo{
  font-size:18px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

h2{
  font-size:22px;
  margin-bottom:15px;
}

h3{
  font-size:17px;
  margin-bottom:14px;
}

.summary{
  background:#f5f5f5;
  padding:15px;
  border-radius:12px;
  line-height:1.9;
  font-size:14px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin-top:12px;
  padding-top:12px;
  border-top:1px solid #ddd;
}

.whatsapp{
  width:100%;
  border:none;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}

.home{
  width:100%;
  border:1px solid #ccc;
  background:white;
  padding:13px;
  border-radius:10px;
  margin-top:10px;
  font-size:15px;
  cursor:pointer;
}

.note{
  font-size:12px;
  color:#777;
  line-height:1.5;
  margin-top:8px;
}

</style>

</head>

<body>

<header>

<div class="header">

<div
class="back"
onclick="goBack()">
←
</div>

<div class="logo">
SAHIL T SHIRT PRINTING
</div>

</div>

</header>


<div class="container">


<div class="card">

<h2>🛒 Your Order</h2>

<div
class="summary"
id="summary">

Loading order...

</div>

</div>


<div class="card">

<h3>👤 Customer Details</h3>


<label>
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter your name">


<label>
Mobile Number
</label>

<input
type="tel"
id="phone"
placeholder="Enter mobile number">


<label>
Delivery Address
</label>

<textarea
id="address"
placeholder="House no, street, area, city, pincode"></textarea>


<p class="note">
Please enter correct details so we can contact you
regarding your order.
</p>


<button
class="whatsapp"
onclick="sendWhatsApp()">

📲 Order on WhatsApp

</button>

</div>


<button
class="home"
onclick="goHome()">

🏠 Back to Home

</button>


</div>


<script>

let cartItem = null;


/* LOAD CART */

function loadCart(){

  const data =
    localStorage.getItem("cartItem");

  if(!data){

    document.getElementById("summary").innerHTML =
      "🛒 Your cart is empty.";

    return;
  }

  cartItem = JSON.parse(data);

  document.getElementById("summary").innerHTML =

    "<b>Product:</b> " +
    cartItem.product +

    "<br><b>Colour:</b> " +
    cartItem.color +

    "<br><b>Size:</b> " +
    cartItem.size +

    "<br><b>Quantity:</b> " +
    cartItem.quantity +

    "<div class='total'>" +
    "Total: ₹" +
    cartItem.price +
    "</div>";
}


/* WHATSAPP ORDER */

function sendWhatsApp(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const address =
    document.getElementById("address").value.trim();


  if(!cartItem){

    alert("Cart empty hai.");

    return;
  }


  if(!name){

    alert("Please apna naam enter karein.");

    return;
  }


  if(!phone){

    alert("Please mobile number enter karein.");

    return;
  }


  if(phone.length < 10){

    alert("Please valid mobile number enter karein.");

    return;
  }


  if(!address){

    alert("Please delivery address enter karein.");

    return;
  }


  /* AAPKA WHATSAPP NUMBER */

  const myWhatsAppNumber =
    "918250366736";


  const message =

    "🛍️ *NEW ORDER*%0A%0A" +

    "*SAHIL T SHIRT PRINTING*%0A%0A" +

    "👕 Product: " +
    cartItem.product +
    "%0A" +

    "🎨 Colour: " +
    cartItem.color +
    "%0A" +

    "📏 Size: " +
    cartItem.size +
    "%0A" +

    "🔢 Quantity: " +
    cartItem.quantity +
    "%0A" +

    "💰 Total: ₹" +
    cartItem.price +
    "%0A%0A" +

    "👤 *CUSTOMER DETAILS*%0A%0A" +

    "Name: " +
    name +
    "%0A" +

    "Mobile: " +
    phone +
    "%0A" +

    "Address: " +
    address;


  const url =
    "https://wa.me/" +
    myWhatsAppNumber +
    "?text=" +
    message;


  window.open(
    url,
    "_blank"
  );

}


/* BACK */

function goBack(){

  window.location.href =
    "customize.html";

}


/* HOME */

function goHome(){

  window.location.href =
    "index.html";

}


loadCart();

</script>

</body>

</html>
